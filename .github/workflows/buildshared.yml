name: LCUI3 Windows Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  TARGET_MAJOR: 3
  TARGET_VERSION: 3.0.0
  TARGET_KIND: shared

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
        arch: [x86, x64]
    name: "Build Windows shared library (${{ matrix.arch }} ${{ matrix.mode }})"
    steps:
      # 拉取 LCUI 官方仓库的 develop 分支
      - uses: actions/checkout@v4
        with:
          repository: lc-soft/LCUI      # ← 指定别人的仓库
          ref: develop                    # ← 指定 develop 分支
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: false

      - name: Configure
        run: xmake config -y -v -k ${{ env.TARGET_KIND }} -m ${{ matrix.mode }} -a ${{ matrix.arch }}

      - name: Build
        run: xmake -v

      - name: Run tests
        run: xmake test

      - name: Package
        run: |
          xmake package
          xmake install -o dist/lcui-package

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-${{ env.TARGET_KIND }}-${{ matrix.arch }}-${{ matrix.mode }}-windows
          path: dist/lcui-package
