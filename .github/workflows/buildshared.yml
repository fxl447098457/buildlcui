name: LCUI3 Windows Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

env:
  TARGET_MAJOR: 3
  TARGET_VERSION: 3.0.0
  TARGET_KIND: shared

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
        arch: [x86, x64]
    name: "Build Windows shared library (${{ matrix.arch }} ${{ matrix.mode }})"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lc-soft/LCUI
          ref: develop
          submodules: recursive

      - name: Patch xmake.lua for Windows DLL
        shell: python
        run: |
          import os

          files = [
              "xmake.lua",
              "lib/yutil/xmake.lua",
              "lib/ptk/xmake.lua",
              "lib/pandagl/xmake.lua",
              "lib/css/xmake.lua",
              "lib/thread/xmake.lua",
              "lib/worker/xmake.lua",
              "lib/ui/xmake.lua",
              "lib/ui-cursor/xmake.lua",
              "lib/ui-server/xmake.lua",
              "lib/ui-xml/xmake.lua",
              "lib/ui-router/xmake.lua",
              "lib/router/xmake.lua",
              "lib/i18n/xmake.lua",
          ]

          for path in files:
              if not os.path.exists(path):
                  print(f"SKIP (not found): {path}")
                  continue

              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              # 1) Add export_all after set_kind
              new_lines = []
              patched = False
              for line in lines:
                  new_lines.append(line)
                  stripped = line.strip()
                  if not patched and stripped.startswith('set_kind('):
                      # Get indentation from original line
                      indent = line[:len(line) - len(line.lstrip())]
                      new_lines.append(f'{indent}add_rules("utils.symbols.export_all")
')
                      patched = True
                      print(f"PATCHED export_all: {path}")

              if not patched:
                  print(f"WARN: set_kind not found in {path}")

              # 2) Remove warnings as errors
              content = "".join(new_lines)
              if 'set_warnings("all", "error")' in content:
                  content = content.replace('set_warnings("all", "error")', 'set_warnings("all")')
                  print(f"PATCHED warnings: {path}")

              with open(path, "w", encoding="utf-8", newline="
") as f:
                  f.write(content)

          # Verify libptk
          print("\n--- lib/ptk/xmake.lua (first 15 lines) ---")
          with open("lib/ptk/xmake.lua", "r", encoding="utf-8") as f:
              for i, line in enumerate(f):
                  if i >= 15:
                      break
                  print(line.rstrip())
          print("--- end ---\n")

          print("Patch done")

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: false

      - name: Configure
        run: xmake config -y -v -k ${{ env.TARGET_KIND }} -m ${{ matrix.mode }} -a ${{ matrix.arch }}

      - name: Build
        run: xmake -v

      - name: Run tests
        continue-on-error: true
        run: xmake test

      - name: Package
        run: |
          xmake package
          xmake install -o dist/lcui-package

      - name: List DLL files
        shell: pwsh
        run: |
          Write-Host "=== Build output ==="
          Get-ChildItem -Recurse build\windows\${{ matrix.arch }}\${{ matrix.mode }}\*.dll | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== Package output ==="
          Get-ChildItem -Recurse dist\lcui-package\*.dll | ForEach-Object { Write-Host $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-${{ env.TARGET_KIND }}-${{ matrix.arch }}-${{ matrix.mode }}-windows
          path: dist/lcui-package

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          $tag = "v${{ env.TARGET_VERSION }}-${{ github.run_number }}"
          git tag $tag
          git push origin $tag
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Resolve tag name
        id: tag
        shell: pwsh
        run: |
          if ($env:TAG_NAME) {
            "name=$($env:TAG_NAME)" >> $env:GITHUB_OUTPUT
          } else {
            "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Package artifacts into zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-assets | Out-Null
          $archs = @("x86", "x64")
          $modes = @("release", "debug")
          foreach ($arch in $archs) {
            foreach ($mode in $modes) {
              $src = "./artifacts/lcui3-3.0.0-shared-$arch-$mode-windows"
              $zip = "./release-assets/lcui3-3.0.0-shared-$arch-$mode-windows.zip"
              if (Test-Path $src) {
                Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
                Write-Host "Created: $zip"
              } else {
                Write-Host "Warning: $src not found"
              }
            }
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
