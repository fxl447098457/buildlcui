name: LCUI3 Windows Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  TARGET_MAJOR: 3
  TARGET_VERSION: 3.0.0
  TARGET_KIND: shared

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
        arch: [x86, x64]
    name: "Build Windows shared library (${{ matrix.arch }} ${{ matrix.mode }})"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lc-soft/LCUI
          ref: develop
          submodules: recursive

      # ============================================
      # 用 Python 可靠地 Patch 所有子库
      # ============================================
      - name: Patch xmake.lua for Windows DLL
        shell: python
        run: |
          import os
          import re

          libs = [
              "lib/yutil", "lib/ptk", "lib/pandagl", "lib/css",
              "lib/thread", "lib/worker", "lib/ui", "lib/ui-cursor",
              "lib/ui-server", "lib/ui-xml", "lib/ui-router",
              "lib/router", "lib/i18n",
          ]

          for lib in libs:
              path = f"{lib}/xmake.lua"
              if not os.path.exists(path):
                  print(f"Skip: {path}")
                  continue

              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "utils.symbols.export_all" in content:
                  print(f"Skip: {path} already patched")
                  continue

              lines = content.splitlines()
              new_lines = []
              patched = False

              for line in lines:
                  new_lines.append(line)
                  if not patched and re.match(r'^(\s*)set_kind\(["\']', line):
                      indent = re.match(r'^(\s*)', line).group(1)
                      new_lines.append(f'{indent}add_rules("utils.symbols.export_all")')
                      patched = True
                      print(f"Patched: {path}")

              if patched:
                  with open(path, "w", encoding="utf-8", newline="\n") as f:
                      f.write("\n".join(new_lines) + "\n")
              else:
                  print(f"Warning: {path} - set_kind not found")

          print("Patch done")
      # ============================================

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: false

      - name: Configure
        run: xmake config -y -v -k ${{ env.TARGET_KIND }} -m ${{ matrix.mode }} -a ${{ matrix.arch }}

      - name: Build
        run: xmake -v

      - name: Run tests
        run: xmake test

      - name: Package
        run: |
          xmake package
          xmake install -o dist/lcui-package

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-${{ env.TARGET_KIND }}-${{ matrix.arch }}-${{ matrix.mode }}-windows
          path: dist/lcui-package
