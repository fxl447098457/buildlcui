name: LCUI3 Windows Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  TARGET_MAJOR: 3
  TARGET_VERSION: 3.0.0
  TARGET_KIND: shared

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
        arch: [x86, x64]
    name: "Build Windows shared library (${{ matrix.arch }} ${{ matrix.mode }})"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lc-soft/LCUI
          ref: develop
          submodules: recursive

      # ============================================
      # Patch：1) 导出所有符号  2) 警告不视为错误
      # ============================================
      - name: Patch xmake.lua for Windows DLL
        shell: python
        run: |
          import os
          import re

          # 需要 patch 的子库
          libs = [
              "lib/yutil", "lib/ptk", "lib/pandagl", "lib/css",
              "lib/thread", "lib/worker", "lib/ui", "lib/ui-cursor",
              "lib/ui-server", "lib/ui-xml", "lib/ui-router",
              "lib/router", "lib/i18n",
          ]

          # 1) 给每个子库添加 export_all
          for lib in libs:
              path = f"{lib}/xmake.lua"
              if not os.path.exists(path):
                  continue

              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "utils.symbols.export_all" in content:
                  pass  # 已 patch
              else:
                  lines = content.splitlines()
                  new_lines = []
                  patched = False
                  for line in lines:
                      new_lines.append(line)
                      if not patched and re.match(r'^(\s*)set_kind\(["\']', line):
                          indent = re.match(r'^(\s*)', line).group(1)
                          new_lines.append(f'{indent}add_rules("utils.symbols.export_all")')
                          patched = True
                  if patched:
                      with open(path, "w", encoding="utf-8", newline="\n") as f:
                          f.write("\n".join(new_lines) + "\n")
                      print(f"Added export_all: {path}")

          # 2) 去掉所有 set_warnings("all", "error") 中的 "error"
          #    根目录和子库都可能有
          files_to_fix = ["xmake.lua"] + [f"{lib}/xmake.lua" for lib in libs]
          for path in files_to_fix:
              if not os.path.exists(path):
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # 替换 set_warnings("all", "error") 为 set_warnings("all")
              new_content = content.replace('set_warnings("all", "error")', 'set_warnings("all")')
              if new_content != content:
                  with open(path, "w", encoding="utf-8", newline="\n") as f:
                      f.write(new_content)
                  print(f'Fixed warnings: {path}')

          print("Patch done")
      # ============================================

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: false

      - name: Configure
        run: xmake config -y -v -k ${{ env.TARGET_KIND }} -m ${{ matrix.mode }} -a ${{ matrix.arch }}

      - name: Build
        run: xmake -v

      - name: Run tests
        run: xmake test

      - name: Package
        run: |
          xmake package
          xmake install -o dist/lcui-package

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-${{ env.TARGET_KIND }}-${{ matrix.arch }}-${{ matrix.mode }}-windows
          path: dist/lcui-package
