name: LCUI3 Windows Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

env:
  TARGET_MAJOR: 3
  TARGET_VERSION: 3.0.0
  TARGET_KIND: shared

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
        arch: [x86, x64]
    name: "Build Windows shared library (${{ matrix.arch }} ${{ matrix.mode }})"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lc-soft/LCUI
          ref: develop
          submodules: recursive

      - name: Patch xmake.lua for single DLL
        shell: python
        run: |
          import os
          import re

          libs = [
              "lib/yutil", "lib/ptk", "lib/pandagl", "lib/css",
              "lib/thread", "lib/worker", "lib/ui", "lib/ui-cursor",
              "lib/ui-server", "lib/ui-xml", "lib/ui-router",
              "lib/router", "lib/i18n",
          ]

          for lib in libs:
              path = lib + "/xmake.lua"
              if not os.path.exists(path):
                  print("SKIP: " + path)
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # 1) 子库全部 static
              content = content.replace('set_kind("$(kind)")', 'set_kind("static")')

              # 2) 去掉 export_all（static 不支持）
              content = content.replace('add_rules("utils.symbols.export_all")\n', "")
              content = content.replace('add_rules("utils.symbols.export_all")', "")

              # 3) 去掉 warnings as errors
              content = content.replace('set_warnings("all", "error")', 'set_warnings("all")')

              # 4) 关键：全局 -k shared 时 is_kind("static") 为 false，
              #    强制改为 if true 让 set_configvar 无条件执行
              content = content.replace('if is_kind("static") then', 'if true then')

              # 5) 同时加 add_defines(..., {public=true}) 让依赖者编译时也能看到宏
              m = re.search(r'set_configvar\("([^"]+_STATIC_BUILD)"\s*,\s*1\)', content)
              if m:
                  macro = m.group(1)
                  old = 'set_kind("static")'
                  new = 'set_kind("static")\nadd_defines("' + macro + '", {public = true})'
                  if old in content and new not in content:
                      content = content.replace(old, new, 1)
                      print("Added define " + macro + " in " + path)

              with open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(content)
              print("Patched: " + path)

          # 6) 根目录 lcui 保持 shared，加 export_all
          with open("xmake.lua", "r", encoding="utf-8") as f:
              lines = f.readlines()
          new_lines = []
          in_lcui = False
          patched = False
          for line in lines:
              new_lines.append(line)
              if 'target("lcui")' in line:
                  in_lcui = True
              if in_lcui and not patched and line.strip().startswith("set_kind("):
                  indent = line[:len(line) - len(line.lstrip())]
                  new_lines.append(indent + 'add_rules("utils.symbols.export_all")\n')
                  patched = True
                  in_lcui = False
          content = "".join(new_lines)
          content = content.replace('set_warnings("all", "error")', 'set_warnings("all")')
          with open("xmake.lua", "w", encoding="utf-8", newline="\n") as f:
              f.write(content)
          print("Patched root xmake.lua")

          print("Patch done")

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: false

      - name: Configure
        run: xmake config -y -v -k ${{ env.TARGET_KIND }} -m ${{ matrix.mode }} -a ${{ matrix.arch }}

      - name: Build
        run: xmake -v

      - name: Run tests
        continue-on-error: true
        run: xmake test

      - name: Package
        run: |
          xmake package
          xmake install -o dist/lcui-package

      - name: Zip package
        shell: pwsh
        run: |
          $zip = "dist/lcui3-${{ env.TARGET_VERSION }}-${{ matrix.arch }}-${{ matrix.mode }}.zip"
          Compress-Archive -Path "dist/lcui-package/*" -DestinationPath $zip -Force
          Write-Host "Created: $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-${{ env.TARGET_KIND }}-${{ matrix.arch }}-${{ matrix.mode }}-windows
          path: dist/lcui3-*.zip

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          $tag = "v${{ env.TARGET_VERSION }}-${{ github.run_number }}"
          git tag $tag
          git push origin $tag
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Resolve tag name
        id: tag
        shell: pwsh
        run: |
          if ($env:TAG_NAME) {
            "name=$($env:TAG_NAME)" >> $env:GITHUB_OUTPUT
          } else {
            "name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Collect zips for release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-assets | Out-Null
          Get-ChildItem -Recurse ./artifacts/*.zip | ForEach-Object {
            Copy-Item $_.FullName ./release-assets/
            Write-Host "Collected: $($_.Name)"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
