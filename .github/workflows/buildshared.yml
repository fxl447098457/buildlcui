name: LCUI3 Windows Shared Library

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  TARGET_MAJOR: 3
  TARGET_VERSION: 3.0.0
  TARGET_KIND: shared

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
        arch: [x86, x64]
    name: "Build Windows shared library (${{ matrix.arch }} ${{ matrix.mode }})"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lc-soft/LCUI
          ref: develop
          submodules: recursive

      - name: Patch xmake.lua for Windows DLL
        shell: python
        run: |
          import os
          import re

          files = [
              "xmake.lua",
              "lib/yutil/xmake.lua",
              "lib/ptk/xmake.lua",
              "lib/pandagl/xmake.lua",
              "lib/css/xmake.lua",
              "lib/thread/xmake.lua",
              "lib/worker/xmake.lua",
              "lib/ui/xmake.lua",
              "lib/ui-cursor/xmake.lua",
              "lib/ui-server/xmake.lua",
              "lib/ui-xml/xmake.lua",
              "lib/ui-router/xmake.lua",
              "lib/router/xmake.lua",
              "lib/i18n/xmake.lua",
          ]

          for path in files:
              if not os.path.exists(path):
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # 1) 添加 export_all，强制导出所有符号
              if "utils.symbols.export_all" not in content:
                  lines = content.splitlines()
                  new_lines = []
                  patched = False
                  for line in lines:
                      new_lines.append(line)
                      if not patched and re.match(r'^(\s*)set_kind\(["\']', line):
                          indent = re.match(r'^(\s*)', line).group(1)
                          new_lines.append(f'{indent}add_rules("utils.symbols.export_all")')
                          patched = True
                  if patched:
                      with open(path, "w", encoding="utf-8", newline="\n") as f:
                          f.write("\n".join(new_lines) + "\n")
                      print(f"Added export_all: {path}")

              # 2) 去掉 "warnings as errors"，避免编译中断
              if 'set_warnings("all", "error")' in content:
                  new_content = content.replace('set_warnings("all", "error")', 'set_warnings("all")')
                  with open(path, "w", encoding="utf-8", newline="\n") as f:
                      f.write(new_content)
                  print(f"Fixed warnings: {path}")

          print("Patch done")

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          package-cache: false

      - name: Configure
        run: xmake config -y -v -k ${{ env.TARGET_KIND }} -m ${{ matrix.mode }} -a ${{ matrix.arch }}

      - name: Build
        run: xmake -v

      - name: Run tests
        continue-on-error: true
        run: xmake test

      - name: Package
        run: |
          xmake package
          xmake install -o dist/lcui-package

      - name: List DLL files
        shell: pwsh
        run: |
          Write-Host "=== Build output ==="
          Get-ChildItem -Recurse build\windows\${{ matrix.arch }}\${{ matrix.mode }}\*.dll | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== Package output ==="
          Get-ChildItem -Recurse dist\lcui-package\*.dll | ForEach-Object { Write-Host $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: lcui${{ env.TARGET_MAJOR }}-${{ env.TARGET_VERSION }}-${{ env.TARGET_KIND }}-${{ matrix.arch }}-${{ matrix.mode }}-windows
          path: dist/lcui-package

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
